name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: "ci"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with: { go-version-file: "go.mod" }

      - uses: extractions/setup-just@v4

      - env:
          PANDOC_VERSION: "3.1.3"
          PANDOC_SHA256: "74bc434908e4d858b3edbfd6271d2e9e499477837e5df1d630df4e62f113803d"
        run: |
          curl -sfL -o pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_SHA256}  pandoc.tar.gz" | sha256sum -c -
          sudo tar -xzf pandoc.tar.gz -C /usr/local --strip-components 1
          rm pandoc.tar.gz
          pandoc --version | head -1

      - id: harvest
        continue-on-error: true
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: just harvest

      - id: backfill
        continue-on-error: true
        run: just backfill

      - id: media
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: assets-open-run-org
        run: |
          if [ -n "$R2_ACCESS_KEY_ID" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          just media

      - id: build
        continue-on-error: true
        run: just build

      - env:
          BUILT: ${{ steps.build.outcome }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data
          if [ "$BUILT" = success ]; then
            git add content
          else
            git checkout -- content
            git clean -fdq content
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: data sync $(date -u +%F-%T) [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      - if: steps.backfill.outcome == 'failure'
        run: echo "::warning::backfill failed"

      - if: steps.harvest.outcome == 'failure' || steps.media.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "harvest=${{ steps.harvest.outcome }} backfill=${{ steps.backfill.outcome }} media=${{ steps.media.outcome }} build=${{ steps.build.outcome }}"
          exit 1
