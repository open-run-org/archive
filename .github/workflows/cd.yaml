name: CD

on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'templates/**'
      - 'static/**'
      - 'config.toml'
      - '.github/workflows/cd.yaml'

  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ main ]
    
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          sparse-checkout: |
            data/raw
            data/media
            scripts
            templates
            static

      - env:
          PANDOC_VERSION: "3.1.3"
          PANDOC_SHA256: "74bc434908e4d858b3edbfd6271d2e9e499477837e5df1d630df4e62f113803d"
        run: |
          curl -sfL -o pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_SHA256}  pandoc.tar.gz" | sha256sum -c -
          sudo tar -xzf pandoc.tar.gz -C /usr/local --strip-components 1
          rm pandoc.tar.gz

      - run: python3 scripts/build.py data/raw content

      - env:
          ZOLA_VERSION: "0.23.6"
          ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"
        run: |
          curl -sfL -o zola.tar.gz "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/
          rm zola.tar.gz
          zola --version

      - run: zola build --output-dir public

      - env:
          PAGEFIND_VERSION: "1.5.2"
          PAGEFIND_SHA256: "aeb135927856e7a49816cf2c9c2e53167f87afa1f61f7288b7d66c234a950d38"
        run: |
          curl -sfL -o pagefind.tar.gz "https://github.com/CloudCannon/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind_extended-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${PAGEFIND_SHA256}  pagefind.tar.gz" | sha256sum -c -
          tar -xzf pagefind.tar.gz
          ./pagefind_extended --site public --force-language zh
          rm pagefind.tar.gz pagefind_extended

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
