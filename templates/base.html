<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% if config.mode != "serve" %}
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'none'; form-action 'self'">
    {% endif %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <link rel="stylesheet" href="{{ get_url(path="style.css") }}">
    <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path="atom.xml") }}">
    <script src="{{ get_url(path="archive.js") }}" defer></script>
    <noscript><style>.c.folded > .c { display: block; }</style></noscript>
    {% block head %}{% endblock head %}
</head>
<body>
    <header class="top">
        <a class="brand" href="{{ get_url(path="@/_index.md") }}">Reddit Archive<span> / 红迪档案馆</span></a>
        <form class="search" action="{{ get_url(path="@/search/_index.md") }}" method="get" role="search">
            <input type="search" name="q" placeholder="Search" aria-label="Search" required>
        </form>
        <nav class="links">
            {% if config.extra.ask %}<a href="{{ get_url(path="@/mofufu/_index.md") }}">Mofufu</a>{% endif %}
            <a href="{{ config.extra.repo }}/releases/latest" target="_blank" title="Download latest archive">Download</a>
            <a href="{{ get_url(path="atom.xml") }}" target="_blank">Feed</a>
            <a href="{{ config.extra.repo }}" target="_blank">GitHub</a>
            <a class="support" href="https://ko-fi.com/clarelab" target="_blank">Support</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>
</body>
</html>
